<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Sofia Cond"; src: url("fonts/sofia_sans_condensed_semibold.ttf"); font-weight: 600; }
  @font-face { font-family: "Sofia Cond"; src: url("fonts/sofia_sans_condensed_medium.ttf"); font-weight: 500; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #FFF4FA; font-family: "Sofia Cond", "Arial Narrow", sans-serif;
    background:
      radial-gradient(62% 92% at 18% 22%, rgba(240, 106, 166, 0.26), rgba(240, 106, 166, 0) 72%),
      linear-gradient(120deg, #D6337F 0%, #C4287A 52%, #B01E6A 100%);
  }
  svg.mark { position: absolute; left: 74px; top: 74px; width: 352px; height: 352px; }
  svg.marks { position: absolute; right: 36px; top: 36px; width: 952px; height: 428px; }
  .copy { position: absolute; left: 452px; top: 156px; width: 540px; }
  h1 { margin: 0; font-size: 140px; line-height: 1; font-weight: 600; letter-spacing: -0.012em; }
  p { margin: 16px 0 0 6px; font-size: 36px; line-height: 1.2; font-weight: 500; color: #FFE4F0; white-space: nowrap; }
</style>
</head>
<body>
  <svg class="marks" viewBox="0 0 952 428" aria-hidden="true">

        <feFlood flood-color="#77103F" flood-opacity="0.38"/>
        <feComposite in2="o" operator="in"/>

    <g filter="url(#shadow)">

    <p>Passport and visa photos, made offline</p>
  </div>
</body>
</html>
